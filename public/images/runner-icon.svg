<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f4f2ff"/>
  <circle cx="200" cy="205" r="150" fill="#dcd6ff"/>
  <circle cx="200" cy="205" r="108" fill="#c2b9fc" opacity="0.6"/>

  <!-- motion lines -->
  <g stroke="#b1a6fb" stroke-width="7" stroke-linecap="round">
    <line x1="95" y1="190" x2="130" y2="185"/>
    <line x1="90" y1="215" x2="130" y2="212"/>
    <line x1="100" y1="240" x2="135" y2="238"/>
  </g>

  <!-- runner figure, moving right -->
  <g fill="none" stroke="#5b4bdb" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- back leg kicked up behind -->
    <polyline points="205,205 168,196 150,155"/>
    <!-- front leg reaching down/forward -->
    <polyline points="205,205 232,238 214,282"/>
    <!-- torso -->
    <line x1="222" y1="140" x2="205" y2="205"/>
    <!-- back arm forward -->
    <polyline points="222,140 255,128 278,148"/>
    <!-- front arm back -->
    <polyline points="222,140 196,163 172,153"/>
  </g>
  <circle cx="228" cy="115" r="19" fill="#4a3bc4"/>

  <!-- ground path -->
  <path d="M90,310 Q200,290 320,310" fill="none" stroke="#9b97b3" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
</svg>
